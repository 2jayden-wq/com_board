<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CommunityConnect - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <main class="main-content">
      <h2 style="text-align: center; color: var(--primary);">CommunityConnect</h2>
      <p style="text-align: center; color: var(--text-muted);">Where Service Meets Heart</p>
      
      <form style="margin-top: 1.5rem;">
        <div class="form-group">
          <label for="username">Email or Username</label>
          <input type="text" id="username" name="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password">
        </div>

        <button type="button" onclick="window.location.href='index.html'" style="width: 100%; margin-bottom: 0.5rem;">Sign In</button>
        <button type="button" onclick="window.location.href='signup.html'" style="width: 100%; background: var(--text-muted);">Sign Up</button>
      </form>
    </main>
  </div>
</body>
</html>
